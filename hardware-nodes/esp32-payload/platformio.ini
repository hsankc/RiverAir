; RiverAir payload node — build configuration
;
; The payload node is an ESP32-S3 sitting on the drone's payload rail. It is a
; separate microcontroller from the flight controller on purpose: the FC must
; never miss a control loop deadline because a sensor bus stalled, and the
; payload work here (flow metering on an interrupt, a pump relay, a release
; servo) is exactly the kind of thing that stalls.
;
;   pio run                  build
;   pio run -t upload        flash over USB
;   pio device monitor       watch the signed frames leave the node

[env:riverair-payload]
platform  = espressif32@6.5.0
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600
board_build.partitions = default_8MB.csv

build_flags =
    -D RIVERAIR_FW_VERSION="\"1.0.0\""
    ; The link to the companion computer. UART1 rather than UART0 so the USB
    ; console stays free for flashing and diagnostics in the field.
    -D LINK_UART_NUM=1
    -D LINK_TX_PIN=17
    -D LINK_RX_PIN=18
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    robtillaart/INA226@^0.5.2
    madhephaestus/ESP32Servo@^3.0.5
    rweather/Crypto@^0.4.0
